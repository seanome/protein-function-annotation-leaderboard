# Claims by MMseqs2's authors, each with the test on this site that would retire it.
# The quote is the authors' own words, written by scripts/fetch_quote.py; the status comes
# from the test (scripts/claims.py), never from this file. Schema: claims/schema.json.

tool: mmseqs2_seqseq
title: MMseqs2
updated: "2026-10-16"

claims:
  - id: blast-sensitivity
    claim: MMseqs2 is almost as sensitive as a full sequence search
    author_claim:
      quote: At 100 times its speed it achieves almost the same sensitivity.
      url: https://github.com/soedinglab/MMseqs2
      text_url: https://raw.githubusercontent.com/soedinglab/MMseqs2/master/README.md
      fetched: '2026-10-16'
      sha256: 0fb838a3bc33f092d3f0d46782038e10e5959ec4ae8883b55142263fe4a59755
    kill: MMseqs2's Fmax on Pfam domains is more than 0.05 below phmmer's on any of the 15 relatives
    scope: >-
      "its" in the quote is BLAST. This site does not run BLAST, so phmmer, a full
      sequence-to-sequence search, stands in for it. Pfam-A domain instances, raw calls, 998
      human queries, MMseqs2 at sensitivity 7 (setting s7). Speed is not part of this test.
    test:
      kind: table
      experiment: qfo_region_midi_plus
      truth_source: Pfam-A domain instances
      dedup_or_raw: raw
      stratum_axis: all
      stratum_bin: all
      metric: fmax
      tool: mmseqs2_seqseq
      setting: s7
      against: {tool: hmmer3_phmmer, setting: default}
      targets: [QfO arabidopsis, QfO btaurus, QfO chicken, QfO ciona, QfO clupus, QfO ecoli, QfO fly, QfO mdomestica, QfO mouse, QfO ptroglodytes, QfO rnorvegicus, QfO worm, QfO xtropicalis, QfO yeast, QfO zebrafish]
      kill_if: {below_by_more_than: 0.05}
    evidence: {label: leaderboard, href: index.html}
