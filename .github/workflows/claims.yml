# Checks every claims/<tool>.yaml: the schema, each quoted inventory value against
# data/experiments.json, and each table test against data/results.parquet.
# Also rebuilds the site from data/ and fails if docs/ differs from what is committed,
# so the published pages always match the tables and the code that built them.
name: claims
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install polars==1.44.2 pyarrow==26.0.0 pyyaml==6.0.2 jsonschema==4.23.0
      - run: python scripts/claims.py --data data --check
      - run: python tests/check_claims.py
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install polars==1.44.2 pyarrow==26.0.0 Markdown==3.11.1 pyyaml==6.0.2 jsonschema==4.23.0 numpy==2.3.5
      - run: python scripts/build_site.py --data data --out docs
      - name: docs/ must match a fresh build
        run: |
          git status --porcelain -- docs
          git diff --stat --exit-code -- docs
          test -z "$(git status --porcelain -- docs)"
