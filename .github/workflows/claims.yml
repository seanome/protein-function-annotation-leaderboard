# Checks every claims/<tool>.yaml: the schema, each quoted inventory value against
# data/experiments.json, and each table test against data/results.parquet.
name: claims
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install polars==1.44.2 pyarrow==26.0.0 pyyaml==6.0.2 jsonschema==4.23.0
      - run: python scripts/claims.py --data data --check
