# Claims by Foldseek's authors, each with the test on this site that would retire it.
# The quote is the authors' own words, written by scripts/fetch_quote.py; the status comes
# from the test (scripts/claims.py), never from this file. Schema: claims/schema.json.

tool: foldseek
title: Foldseek
updated: "2026-10-16"

claims:
  - id: fast-and-sensitive
    claim: Foldseek is sensitive
    author_claim:
      quote: Foldseek enables fast and sensitive comparisons of large protein structure sets
      url: https://github.com/steineggerlab/foldseek
      text_url: https://raw.githubusercontent.com/steineggerlab/foldseek/master/README.md
      fetched: '2026-10-16'
      sha256: f1ed04aac6703c4af2b3e6782a1b84f2d8da59845564580491c24ddb499d863d
    kill: Foldseek's Fmax on Pfam domains is more than 0.05 below phmmer's, a sequence-only search, on any relative Foldseek searched
    scope: >-
      Pfam-A domain instances, raw calls, 998 human queries, the 10 relatives with Foldseek
      rows (setting 3di_aa against AlphaFold structures). Tests the "sensitive" half only;
      speed is on the Cost page and is not part of this test. Pfam domains are defined from
      sequence, which favours sequence searches like phmmer; a structure-based truth set
      would be the fairer test and is not on this site yet.
    test:
      kind: table
      experiment: qfo_region_midi_plus
      truth_source: Pfam-A domain instances
      dedup_or_raw: raw
      stratum_axis: all
      stratum_bin: all
      metric: fmax
      tool: foldseek
      setting: 3di_aa
      against: {tool: hmmer3_phmmer, setting: default}
      targets: [QfO arabidopsis, QfO chicken, QfO ciona, QfO ecoli, QfO fly, QfO mouse, QfO rnorvegicus, QfO worm, QfO yeast, QfO zebrafish]
      kill_if: {below_by_more_than: 0.05}
    evidence: {label: leaderboard, href: index.html}
